<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | Ruben Panzich</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: #121212;
        color: #f5f5f5;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 5vw, 2.5rem);
      }
      p {
        margin: 0;
        max-width: 34ch;
        line-height: 1.5;
        opacity: 0.7;
      }
      button {
        margin-top: 1rem;
        padding: 0.6rem 1.4rem;
        border: 1px solid #f5f5f5;
        border-radius: 999px;
        background: transparent;
        color: #f5f5f5;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #f5f5f5;
        color: #121212;
      }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>
      This page hasn't been loaded before, so it isn't available offline. Check
      your connection and try again.
    </p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
