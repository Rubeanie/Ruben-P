version: 2
updates:
  # One PR a month per ecosystem; security fixes still arrive as they're found.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ['*']
